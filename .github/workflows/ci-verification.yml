name: Verificación CI y Emulador Oficial Firestore Rules

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-emulator:
    name: Lint, Build, Tests y Emulador Oficial Firestore
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configurar Java 21 (requerido por Firebase Firestore Emulator)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verificar versiones de entorno (Node, Java)
        run: |
          node -v
          npm -v
          java -version

      - name: Instalar dependencias reproducibles (npm ci)
        run: npm ci --no-audit --no-fund

      - name: Instalar Firebase CLI oficial
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Comprobación de tipos (npm run lint)
        run: npm run lint

      - name: Compilación cliente y servidor (npm run build)
        run: npm run build

      - name: Suite de pruebas unitarias e integración (npm test)
        run: npm test

      - name: Suite oficial del Emulador Firestore Rules (npm run test:rules:emulator)
        run: |
          set +e
          npm run test:rules:emulator 2>&1 | tee /tmp/emulator-test.log
          EC=${PIPESTATUS[0]}
          if [ "$EC" -ne 0 ]; then
            FAIL_LINES=$(grep -E '\[CHECK|\[FAIL|Error:|PERMISSION_DENIED.*evaluation error' /tmp/emulator-test.log | tail -n 15 | tr '\n' ' | ' | sed 's/%/%25/g')
            if [ -z "$FAIL_LINES" ]; then
              FAIL_LINES=$(tail -n 20 /tmp/emulator-test.log | tr '\n' ' | ' | sed 's/%/%25/g')
            fi
            echo "::error title=Firestore Emulator Failure::${FAIL_LINES}"
            exit "$EC"
          fi
          SUMMARY=$(grep -E '^\[PASS\]' /tmp/emulator-test.log | tail -n 5 | tr '\n' ' ')
          echo "::notice title=Firestore Emulator Summary::$SUMMARY"
